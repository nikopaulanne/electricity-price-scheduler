blueprint:
  name: Run a switch with Electricity Price Scheduler
  description: >
    Follow the profile's Use electricity now signal. Choose a switch that can
    safely be turned on and off automatically. If the signal is unavailable,
    the switch turns off by default. Keep device-specific protections in place.
  domain: automation
  source_url: https://github.com/nikopaulanne/electricity-price-scheduler/blob/main/blueprints/automation/electricity_price_scheduler/follow_price_profile.yaml
  homeassistant:
    min_version: 2026.11.0
  input:
    signal:
      name: Use electricity now
      description: Choose your price profile's Use electricity now binary sensor. Use a separate automation for heating phases.
      selector:
        entity:
          filter:
            - domain: binary_sensor
              integration: electricity_price_scheduler
    switch:
      name: Switch to control
      selector:
        entity:
          filter:
            - domain: switch
    stop_on_missing_signal:
      name: Turn off if the signal is unavailable
      description: Turn this off if you prefer to leave the switch as it is until the signal returns.
      default: true
      selector:
        boolean:

triggers:
  - trigger: state
    entity_id: !input signal
    to: null
  - trigger: state
    entity_id: !input switch
    from:
      - unavailable
      - unknown
    to:
      - "on"
      - "off"
  - trigger: homeassistant
    event: start

actions:
  - choose:
      - conditions:
          - condition: state
            entity_id: !input signal
            state: "on"
        sequence:
          - action: switch.turn_on
            target:
              entity_id: !input switch
      - conditions:
          - condition: state
            entity_id: !input signal
            state: "off"
        sequence:
          - action: switch.turn_off
            target:
              entity_id: !input switch
    default:
      - action: switch.turn_off
        enabled: !input stop_on_missing_signal
        target:
          entity_id: !input switch

mode: restart
